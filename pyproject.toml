[project]
name = "byteguard"
version = "1.0.0"
description = "Visual Error Correction of Images using LDPC Codes on Tanner Graphs"
requires-python = ">=3.11"
dependencies = [
    "pybind11>=2.13.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pillow>=10.0.0",
    "python-multipart>=0.0.9",
]

[build-system]
requires = ["setuptools", "pybind11"]
build-backend = "setuptools.build_meta"
